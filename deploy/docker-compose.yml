services:
  audio-backend:
    build:
      context: .
      dockerfile: ./audioBackend/Dockerfile
    image: karankumar9955/onemelodyaudiobackend:latest
    container_name: audio-backend
    restart: unless-stopped
    ports:
      - "443:3000"
    env_file:
      - production/audiobackend.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - onemelody-network

  audio-frontend:
    build:
      context: .
      dockerfile: ./audioFrontend/Dockerfile
      args:
        - NEXT_PUBLIC_AUTH0_DOMAIN=dev-csos8ec54uie5f2g.us.auth0.com
        - NEXT_PUBLIC_AUTH0_CLIENT_ID=8QWnzqjQxeYFMA7jbDmHDHDii93iPY2o
        - NEXT_PUBLIC_API_URL=http://3.239.229.45:443/api/v1
    image: karankumar9955/onemelodyaudiofrontend:latest
    container_name: audio-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file:
      - production/audiofrontend.env
    environment:
      - NODE_ENV=production
    networks:
      - onemelody-network

networks:
  onemelody-network:
    name: onemelody-network
    driver: bridge
